[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-memory"
version = "0.1.2"
description = "Long-term memory for AI coding agents. Runs locally, extensively tested."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# The memory server has no required third-party dependencies: it is standard-library Python.
dependencies = []

[project.scripts]
signal-memory-mcp = "signal_engine.dumb_mcp_server:main"

[project.optional-dependencies]
# Full search (search by meaning, not just words): a small on-device model, run locally. The
# plugin installs this in the background after memory has already started.
local = ["sentence-transformers>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
